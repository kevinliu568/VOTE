<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>0票候選人鏡面</title>
<style>
:root{--dpp:#16883a;--kmt:#0c2a92;--tpp:#12a1a6;--ind:#5b5b5b;--yel:#ffe500;--panel:#f4f6f8}
*{box-sizing:border-box}
html,body{margin:0;background:#15181c;color:#eee;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif}
#wrap{position:relative;width:100%;max-width:1600px;margin:0 auto;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  background:radial-gradient(ellipse at 70% 30%,#c9d2da 0,#8e9aa5 45%,#3c4650 100%)}
.flip{transform-origin:50% 50%;transition:transform var(--half,160ms) ease-in-out}
.flip.closed{transform:scaleY(0)}
/* ---------- 上方 6 都 ---------- */
.tp{position:absolute;width:654px;height:182px;background:var(--panel);border:3px solid #dfe4ea;box-shadow:0 4px 10px rgba(0,0,0,.35)}
.tp .city{position:absolute;left:6px;top:6px;bottom:6px;width:56px;background:var(--yel);color:#000;font-size:46px;font-weight:900;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.08}
.tp .row{position:absolute;left:68px;right:6px;height:80px}
.tp .row.r1{top:6px}.tp .row.r2{top:92px}
.tp .name{position:absolute;left:0;top:0;bottom:0;width:224px;background:var(--c);color:#fff;font-size:48px;font-weight:900;
  display:flex;align-items:center;justify-content:center;letter-spacing:4px;white-space:nowrap;overflow:hidden}
.tp .vote{position:absolute;left:232px;right:0;top:0;bottom:0;background:linear-gradient(#fff,#e7ebf0);color:#1f1f1f;
  font:900 66px/1 Arial,"Microsoft JhengHei",sans-serif;display:flex;align-items:center;justify-content:flex-end;padding-right:26px}
.tp .vote::after{content:"";position:absolute;left:40px;right:14px;bottom:5px;height:4px;background:var(--c)}
small.w{font-size:.62em;margin:0 4px}
/* ---------- 下方 16 縣市 ---------- */
.bb{position:absolute;top:791px;width:428px;height:158px;background:#fff;box-shadow:0 4px 10px rgba(0,0,0,.35)}
.bb .city{position:absolute;left:0;top:0;bottom:0;width:52px;color:#222;font-size:38px;font-weight:900;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.bb .city::after{content:"";width:26px;height:4px;background:#d8232a;margin-top:6px}
.bb .row{position:absolute;left:56px;right:4px;height:72px;background:var(--c)}
.bb .row.r1{top:5px}.bb .row.r2{top:81px}
.bb .name{position:absolute;left:0;top:0;bottom:0;width:180px;color:#fff;font-size:38px;font-weight:900;display:flex;align-items:center;
  justify-content:center;white-space:nowrap;overflow:hidden;background:rgba(0,0,0,.18)}
.bb .vote{position:absolute;left:180px;right:0;top:0;bottom:0;color:#fff;font:900 52px/1 Arial,"Microsoft JhengHei",sans-serif;
  display:flex;align-items:center;justify-content:flex-end;padding-right:16px}
.long{letter-spacing:0!important}
.tp .name,.bb .name{padding-left:30px}
.num{position:absolute;left:4px;top:4px;min-width:30px;height:30px;padding:0 4px;border-radius:15px;background:#fff;color:var(--c);
  font:900 24px/30px Arial,sans-serif;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.bb .num{min-width:26px;height:26px;font-size:20px;line-height:26px;border-radius:13px}
/* ---------- 其他 ---------- */
#anchor{position:absolute;left:1452px;top:131px;width:388px;height:488px;border:6px solid #fff;
  background:linear-gradient(160deg,#1b3fae,#3c79e0 60%,#86b5ff);display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.75);font-size:34px;font-weight:700;text-align:center}
#logo{position:absolute;left:1452px;top:50px;width:388px;height:64px;display:flex;align-items:center;justify-content:center;
  font-size:38px;font-weight:900;color:#fff;letter-spacing:6px;text-shadow:0 2px 6px rgba(0,0,0,.5)}
#title{position:absolute;left:82px;top:649px;width:1768px;height:126px;background:var(--yel);border:4px solid #222;color:#000;
  font-size:76px;font-weight:900;display:flex;align-items:center;justify-content:center;letter-spacing:6px}
#ticker{position:absolute;left:0;bottom:0;width:100%;height:112px;background:#222;display:flex;align-items:center}
#clock{width:350px;text-align:center;font:900 54px Arial,sans-serif;color:#fff}
#tickTxt{flex:1;height:76px;margin-right:30px;background:#fff;color:#111;font-size:44px;font-weight:900;display:flex;align-items:center;padding:0 24px}
#tickTxt b{background:#c8202a;color:#fff;padding:2px 14px;margin-right:20px}
#pageDots{position:absolute;left:82px;top:955px;display:flex;gap:10px}
#pageDots i{width:46px;height:8px;background:rgba(255,255,255,.35)}#pageDots i.on{background:var(--yel)}
/* ---------- 控制列 ---------- */
#ctl{max-width:1600px;margin:12px auto 24px;padding:0 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:15px}
#ctl button{background:#2b313a;color:#fff;border:1px solid #444c57;border-radius:6px;padding:8px 14px;font-size:15px;cursor:pointer}
#ctl button:hover{background:#38404b}
#ctl label{display:flex;gap:8px;align-items:center}
#status{margin-left:auto;color:#ffe500;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div id="logo">開票速報</div>
  <div id="anchor">主播 / 視訊畫面</div>
  <div id="title">2026 縣市長選舉　候選人名單</div>
  <div id="pageDots"></div>
  <div id="ticker"><div id="clock">00:00:00</div><div id="tickTxt"><b>登記</b>直轄市長候選人 23 人・縣市長候選人 58 人　均符合規定</div></div>
</div></div>
<div id="ctl">
  <button id="bPlay">❚❚ 暫停</button>
  <button id="bNext">下一步 ▶</button>
  <button id="bReset">重置</button>
  <label>每頁停留 <input id="hold" type="range" min="1" max="10" step="0.5" value="3"> <span id="holdV">3</span> 秒</label>
  <label>錯開 <input id="stag" type="range" min="0" max="200" step="10" value="60"> <span id="stagV">60</span> ms</label>
  <span id="status"></span>
</div>
<script>
const P={DPP:'var(--dpp)',KMT:'var(--kmt)',TPP:'var(--tpp)',IND:'var(--ind)'};
const D=[
 // 依 2026/10/27 號次抽籤結果排序（中央社），陣列順序 = 號次
 ['T','台北市',[['郭璽','IND'],['林志成','IND'],['沈伯洋','DPP'],['蕭文乾','IND'],['蔣萬安','KMT'],['唐新民','IND']]],
 ['T','新北市',[['蘇巧慧','DPP'],['蘇輝湟','IND'],['李四川','KMT']]],
 ['T','桃園市',[['黃世杰','DPP'],['張善政','KMT']]],
 ['T','台中市',[['何欣純','DPP'],['洪麗華','IND'],['江啟臣','KMT']]],
 ['T','台南市',[['蕭燐洪','IND'],['謝龍介','KMT'],['陳亭妃','DPP'],['葉人文','IND']]],
 ['T','高雄市',[['張靜','IND'],['王肇民','IND'],['柯志恩','KMT'],['洪方隆','IND'],['賴瑞隆','DPP']]],
 ['B','新竹縣',[['鄭朝方','DPP'],['徐欣瑩','KMT'],['朱定瑀','IND']]],
 ['B','苗栗縣',[['陳品安','DPP'],['鍾東錦','KMT']]],
 ['B','彰化縣',[['陳素月','DPP'],['魏平政','KMT'],['邱建富','IND'],['陳重嘉','IND']]],
 ['B','南投縣',[['許淑華','KMT'],['温世政','DPP']]],
 ['B','雲林縣',[['吳炳輝','IND'],['張嘉郡','KMT'],['劉建國','DPP'],['林佳瑜','IND']]],
 ['B','嘉義縣',[['吳品叡','IND'],['蔡易餘','DPP']]],
 ['B','屏東縣',[['蘇清泉','KMT'],['周春米','DPP']]],
 ['B','宜蘭縣',[['林國漳','DPP'],['陳宏毅','IND'],['吳宗憲','KMT'],['劉燦輝','IND'],['楊鉯婷','IND']]],
 ['B','花蓮縣',[['魏嘉賢','IND'],['張峻','IND'],['游淑貞','KMT'],['羅佩秦','IND']]],
 ['B','台東縣',[['李吳穎智','IND'],['陳瑩','DPP'],['王志偉','IND'],['吳秀華','KMT']]],
 ['B','澎湖縣',[['許智富','IND'],['周倪安','IND'],['葉竹林','IND'],['吳淑瑾','DPP'],['陳振中','KMT'],['陳盡川','IND']]],
 ['B','金門縣',[['張國威','IND'],['李文良','IND'],['洪和成','IND'],['張火木','IND'],['陳玉珍','KMT'],['梁文韜','IND'],['黃世團','IND']]],
 ['B','連江縣',[['王忠銘','KMT'],['曹爾元','IND']]],
 ['B','基隆市',[['童子瑋','DPP'],['魏造文','IND'],['謝國樑','KMT']]],
 ['B','新竹市',[['高虹安','IND'],['何志勇','IND'],['莊競程','DPP']]],
 ['B','嘉義市',[['王義成','IND'],['陳愷璜','IND'],['張啓楷','TPP'],['王美惠','DPP'],['黃宏成台灣阿成世界偉人財神總統','IND']]],
].map(([s,name,c])=>({s,name,c:c.map(([n,p],i)=>({no:i+1,n,p,v:0}))}));
const TOP=D.filter(x=>x.s==='T'), BOT=D.filter(x=>x.s==='B');
const pairs=c=>c?Math.ceil(c.c.length/2):0;
const FLIP=320; // 16 fields @50
const stage=document.getElementById('stage');
stage.style.setProperty('--half',FLIP/2+'ms');

// ---------- 建立 10 個槽位 ----------
const slots=[];
function mkRow(cls){return `<div class="row ${cls} flip"><div class="name"></div><div class="num"></div><div class="vote"></div></div>`}
const topPos=[[82,49],[82,248],[82,443],[765,49],[765,248],[765,443]];
topPos.forEach(([x,y])=>{const el=document.createElement('div');el.className='tp';el.style.left=x+'px';el.style.top=y+'px';
  el.innerHTML=`<div class="city flip"></div>${mkRow('r1')}${mkRow('r2')}`;stage.appendChild(el);slots.push({el,city:null,pair:-1})});
[82,537,992,1447].forEach(x=>{const el=document.createElement('div');el.className='bb';el.style.left=x+'px';
  el.innerHTML=`<div class="city flip"></div>${mkRow('r1')}${mkRow('r2')}`;stage.appendChild(el);slots.push({el,city:null,pair:-1})});

const fmt=v=>v<10000?String(v):`${Math.floor(v/1e4)}<small class="w">萬</small>${String(v%1e4).padStart(4,'0')}`;
function apply(sl){
  const {el,city,pair}=sl;
  el.style.visibility=city?'visible':'hidden'; if(!city)return;
  el.querySelector('.city').innerHTML=[...city.name].join('<br>');
  el.querySelectorAll('.row').forEach((row,r)=>{
    const c=city.c[pair*2+r];
    row.style.visibility=c?'visible':'hidden'; if(!c)return;
    row.style.setProperty('--c',P[c.p]||P.IND);
    const nm=row.querySelector('.name'); nm.textContent=c.n;
    const len=[...c.n].length, base=sl.el.classList.contains('tp')?48:38, w=sl.el.classList.contains('tp')?204:168;
    nm.style.fontSize=Math.min(base,Math.floor(w/len))+'px'; nm.classList.toggle('long',len>3);
    row.querySelector('.num').textContent=c.no;
    row.querySelector('.vote').innerHTML=fmt(c.v);
  });
}
function request(i,city,pair,delay){
  // 每一步都翻牌，只有 2 人（同一頁）的縣市也照樣翻轉
  const sl=slots[i]; if(!city&&sl.city===city)return;
  const cityChg=sl.city!==city;
  sl.city=city; sl.pair=pair;
  const parts=[...sl.el.querySelectorAll('.row')]; if(cityChg)parts.push(sl.el.querySelector('.city'));
  setTimeout(()=>{parts.forEach(p=>p.classList.add('closed'));
    setTimeout(()=>{apply(sl);parts.forEach(p=>p.classList.remove('closed'))},FLIP/2)},delay);
}

// ---------- 輪播邏輯（與 VizBasic 相同） ----------
let topStep=0,botPage=0,botStep=0,botMax=1,running=true;
const topMax=Math.max(...TOP.map(pairs)), botPages=Math.ceil(BOT.length/4);
let stagger=60;
// 先輪完的縣市繼續循環（step % 該縣市頁數），頁數最多的輪完才一起換組
function showTop(){TOP.forEach((c,k)=>request(k,c,topStep%pairs(c),k*stagger))}
function showBot(){
  const page=[0,1,2,3].map(k=>BOT[botPage*4+k]||null);
  botMax=Math.max(1,...page.map(pairs));
  page.forEach((c,k)=>request(6+k,c,c?botStep%pairs(c):0,k*stagger));
  document.querySelectorAll('#pageDots i').forEach((d,i)=>d.classList.toggle('on',i===botPage));
  status();
}
function stepAll(){
  topStep=(topStep+1)%topMax; showTop();
  botStep++; if(botStep>=botMax){botStep=0;botPage=(botPage+1)%botPages}
  showBot();
}
function status(){document.getElementById('status').textContent=
  `上方 第${topStep+1}/${topMax}頁　｜　下方 第${botPage+1}/${botPages}組（${BOT.slice(botPage*4,botPage*4+4).map(c=>c.name).join('、')}）第${botStep+1}/${botMax}頁`}
function reset(){topStep=0;botPage=0;botStep=0;slots.forEach(s=>{s.city=undefined;s.pair=-1});showTop();showBot();restartTimer()}

document.getElementById('pageDots').innerHTML='<i></i>'.repeat(botPages);
let hold=3000,timer=null;
function restartTimer(){clearInterval(timer);if(running)timer=setInterval(stepAll,hold)}
const bPlay=document.getElementById('bPlay');
bPlay.onclick=()=>{running=!running;bPlay.textContent=running?'❚❚ 暫停':'▶ 播放';restartTimer()};
document.getElementById('bNext').onclick=()=>{stepAll();restartTimer()};
document.getElementById('bReset').onclick=reset;
const holdI=document.getElementById('hold');holdI.oninput=()=>{hold=holdI.value*1000;document.getElementById('holdV').textContent=holdI.value;restartTimer()};
const stagI=document.getElementById('stag');stagI.oninput=()=>{stagger=+stagI.value;document.getElementById('stagV').textContent=stagI.value};

// ---------- 縮放與時鐘 ----------
function fit(){const w=document.getElementById('wrap').clientWidth,s=w/1920;stage.style.transform=`scale(${s})`;document.getElementById('wrap').style.height=1080*s+'px'}
addEventListener('resize',fit);fit();
setInterval(()=>{document.getElementById('clock').textContent=new Date().toTimeString().slice(0,8)},500);
reset();
</script>
</body>
</html>
